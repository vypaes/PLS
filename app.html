<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLS Demandas</title>
<link rel="manifest" href="manifest-app.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a1b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLS Demandas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--dark:#1a1b1f;--acc:#ea580c;--red:#dc2626;--grn:#16a34a;--blu:#2563eb;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
#login{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;justify-content:center;padding:28px;z-index:50}
#login.off{display:none}
#login img{width:84px;height:84px;border-radius:18px;margin:0 auto 14px;display:block}
#login h1{color:#fff;text-align:center;font-size:20px;margin:0 0 4px}
#login p.s{color:#94a3b8;text-align:center;margin:0 0 22px;font-size:13px}
#login input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f1013;color:#fff;margin-bottom:10px;font-size:16px}
#login button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
#login .err{background:#7f1d1d;color:#fecaca;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
header{background:var(--dark);color:#fff;padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
header h1{font-size:16px;margin:0;flex:1}
header small{display:block;font-weight:400;color:#94a3b8;font-size:11px}
header button{background:#2a2c33;border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:15px}
#sync{width:9px;height:9px;border-radius:50%;background:#22c55e}
#sync.bad{background:#ef4444}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav button span.i{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
nav button.add span.i{background:var(--acc);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 3px 8px rgba(234,88,12,.4);font-size:26px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.sec{margin:14px 0 6px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sec .n{background:var(--dark);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.sec.red{color:var(--red)}.sec.red .n{background:var(--red)}
.sec.grn{color:var(--grn)}
.tech{font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-left:4px solid #94a3b8;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.late{border-left-color:var(--red);background:#fef2f2}
.card.today{border-left-color:var(--acc)}
.card.done{border-left-color:var(--grn);background:#f0fdf4}
.card.canc{opacity:.55}
.card .t1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .cli{font-weight:700;line-height:1.25}
.card .sub{color:var(--mut);font-size:13px;margin-top:2px}
.card .task{margin-top:5px;font-size:14px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e2e8f0;white-space:nowrap}
.badge.red{background:#fee2e2;color:#991b1b}.badge.org{background:#ffedd5;color:#9a3412}.badge.grn{background:#dcfce7;color:#166534}.badge.blu{background:#dbeafe;color:#1e40af}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--mut)}
.stat.red b{color:var(--red)}.stat.org b{color:var(--acc)}.stat.blu b{color:var(--blu)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;min-height:48px}
header img{width:34px;height:34px;border-radius:8px;flex:0 0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.box{background:#fff7ed;border:1px dashed #fdba74;border-radius:12px;padding:12px;margin-bottom:12px}
.box.off{display:none}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;margin-top:10px}.chk input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.addsrv{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
input.q,.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:16px}
input.q{margin-bottom:8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.btn.sec2{background:#e2e8f0;color:var(--ink)}
.btn.grn{background:var(--grn)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:17px;text-transform:capitalize}
.cal-h button{background:#fff;border:1px solid var(--line);border-radius:10px;width:42px;height:38px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .w{text-align:center;font-size:11px;color:var(--mut);padding:3px 0}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:50px;padding:4px 2px;text-align:center;font-size:14px;position:relative}
.cal .d.o{background:transparent;border-color:transparent}
.cal .d.hoje{border-color:var(--acc);font-weight:800}
.cal .d.sel{background:var(--dark);color:#fff}
.cal .d .c{display:block;font-size:10px;font-weight:700;margin-top:3px;border-radius:99px;padding:0 5px;background:#e2e8f0;color:var(--ink);width:fit-content;margin-left:auto;margin-right:auto}
.cal .d .c.late{background:var(--red);color:#fff}
.cal .d.sel .c{background:#fff;color:var(--dark)}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:10px}
.pseg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:13px;font-weight:600;color:var(--mut)}
.pseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.alerta{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.eqc{background:#fff;border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:12px;padding:11px 12px;margin-bottom:8px}
.eqc.ocupado{border-left-color:var(--acc)}.eqc.terminou{border-left-color:var(--grn);background:#f0fdf4}.eqc.livre,.eqc.sem,.eqc.atrasada{border-left-color:var(--red);background:#fef2f2}
.eqc .n{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.eqc .m{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--mut)}
.eqc .m b{color:var(--ink);font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--sab))}
.sheet h2{margin:0 0 4px;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.srv{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.srv .tx{flex:1}.srv small{color:var(--mut);display:block}
.srv button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.srv.ok{color:#166534}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
</style>
</head>

<script>

var PLSCK = (function() {
  var C = { sb: null, chk: function(p) { return p.then(function(r) { if (r.error) throw r.error; return r; }); }, nome: function() { return ''; }, clientes: function() { return []; }, logo: '', toast: function(m) { alert(m); }, onSaved: null, empresa: 'PLS EMPILHADEIRAS' };
  var SECOES = [
    { t: 'OBRIGATÓRIO', its: [{ t: 'O operador é qualificado', sim: 1 }] },
    { t: '1 - SISTEMA ELÉTRICO', its: ['Farol dianteiro', 'Farol traseiro', 'Luz de freio', 'Alarme de ré', 'Luz de lanterna'] },
    { t: '2 - PAINEL', its: ['Marcador de temperatura', 'Buzina', 'Horímetro', 'Luz da bateria', 'Luz de pressão do óleo', 'Retrovisor'] },
    { t: '3 - SISTEMA HIDRÁULICO', its: ['Mangueiras', 'Vazamento hidráulico', 'Sistema de elevação', 'Sistema de inclinação', 'Sistema de direção', 'Nível de óleo hidráulico', 'Cilindro de deslocamento lateral'] },
    { t: '4 - GERAL', its: ['Trava do garfo', 'Extintor de incêndio', 'Pedais (freio e acelerador)', 'Assento do operador', 'Escapamento', 'Alavancas', 'Identificação da capacidade do equipamento', 'Giroflex', 'Funcionamento do freio estacionário', 'Funcionamento do freio', 'Funcionamento do motor', 'Nível do óleo do motor', 'Nível de óleo do freio', 'Nível do líquido de arrefecimento', 'Teste de carga'] },
    { t: '5 - PNEUS', its: ['Dianteiros', 'Traseiros'] },
    { t: '6 - OUTROS', its: [{ t: '', livre: 1 }, { t: '', livre: 1 }, { t: '', livre: 1 }, { t: '', livre: 1 }] }
  ];
  var S = null, V = 'info', IDX = 0, ROOT = null, PDFB = null, PDFN = '', REG = null, PODE_EXC = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function hojeISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function agora() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function br(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function novoEstado() {
    var itens = [];
    SECOES.forEach(function(sec) { sec.its.forEach(function(it, i) { var o = typeof it === 'string' ? { t: it } : it; itens.push({ sec: sec.t, t: o.t, sim: o.sim ? 1 : 0, livre: o.livre ? 1 : 0, s: '', obs: '', foto: '' }); }); });

    D.tecnicos=r[0];D.canais=r[1];D.tipos=r[2];
    D.clientes=r[3].map(function(c){return c.nome;});
    D.demandas=r[4].map(mapDem);D.servicos=r[5].map(mapSrv);
    $('sync').classList.remove('bad');
  }).catch(function(e){$('sync').classList.add('bad');throw e;});
}

/* ---------- itens do painel/calendário ---------- */
function itens(){
  var porId={},pend={},its=[],h=hoje();
  D.demandas.forEach(function(d){porId[d.id]=d;});
  D.servicos.forEach(function(s){(pend[s.demandaId]=pend[s.demandaId]||[]).push(s);});
  D.servicos.forEach(function(s){
    var d=porId[s.demandaId];if(!d||!s.data||d.status==='Cancelado')return;
    var emAnd=s.status==='Em andamento';
    if(!emAnd&&!(s.status==='Concluída'&&s.data===h))return;
    if(emAnd&&d.status==='Concluída')return;
    its.push({id:'s'+s.id,dem:d,tec:s.tecnico||'Sem técnico',data:s.data,cli:d.cliente,equip:d.equipamento,tarefa:s.descricao,entrega:d.dataPrev,done:!emAnd,srv:true});
  });
  D.demandas.forEach(function(d){
    if(!d.dataPrev||d.status==='Cancelado')return;
    var ss=(pend[d.id]||[]);
    if(d.usaServicos&&ss.length){ /* execução vem dos serviços; mostra a entrega só se nenhum serviço cobre */
      if(d.status==='Concluída')return;
      if(ss.some(function(s){return s.status==='Em andamento';}))return;
    }
    var done=d.status==='Concluída';
    if(done&&d.dataPrev!==h)return;
    its.push({id:'d'+d.id,dem:d,tec:tecDem(d)||'Sem técnico',data:d.dataPrev,cli:d.cliente,equip:d.equipamento,tarefa:d.obs||d.tipo||'',entrega:d.dataPrev,done:done,entregaItem:true});
  });
  return its;
}
function porTecnico(lista){
  var g={};lista.forEach(function(i){(g[i.tec]=g[i.tec]||[]).push(i);});
  return Object.keys(g).sort(function(a,b){return a==='Sem técnico'?1:b==='Sem técnico'?-1:a.localeCompare(b,'pt-BR');}).map(function(n){return{n:n,l:g[n].sort(function(a,b){return (a.data||'').localeCompare(b.data||'')||a.cli.localeCompare(b.cli,'pt-BR');})};});
}

function resumoEquipe(its){
  return D.tecnicos.map(function(t){
    var meus=its.filter(function(i){return i.tec===t;});
    var hj=meus.filter(function(i){return !i.done&&diff(i.data)===0;}).length;
    var at=meus.filter(function(i){return !i.done&&diff(i.data)<0;}).length;
    var fe=meus.filter(function(i){return i.done;}).length;
    var fut=meus.filter(function(i){return !i.done&&diff(i.data)>0;}).sort(function(a,b){return a.data.localeCompare(b.data);});
    var est=hj>0?'ocupado':(at>0?'atrasada':(fe>0?'terminou':(fut.length?'livre':'sem')));
    return{tec:t,hoje:hj,atrasadas:at,feitas:fe,proximo:fut.length?fut[0].data:'',estado:est};
  });
}
function ociosos(eq){return eq.filter(function(e){return (e.estado==='sem'||e.estado==='livre'||e.estado==='atrasada')&&!/externo/i.test(e.tec);});}

/* ---------- componentes ---------- */
function cardItem(i,openId){
  var df=diff(i.data),cls='card'+(i.done?' done':df<0?' late':df===0?' today':'');
  var b=i.done?'<span class="badge grn">✔ Concluída</span>':df<0?'<span class="badge red">Atrasada '+curto(i.data)+'</span>':df===0?'<span class="badge org">Hoje</span>':'<span class="badge blu">'+curto(i.data)+'</span>';
  return '<div class="'+cls+'" data-open="'+esc(i.dem.id)+'"><div class="t1"><div class="cli">'+esc(i.cli)+'</div>'+b+'</div>'
   +'<div class="sub">'+esc(i.equip||'')+((i.entregaItem&&i.dem.usaServicos)?' · 📦 só entrega':(i.tec?' · 👤 '+esc(i.tec):''))+'</div>'
   +(i.tarefa?'<div class="task">'+(i.srv?'🔧 ':'')+esc(i.tarefa)+'</div>':'')
   +(i.entrega?'<div class="sub">Entrega: '+br(i.entrega)+'</div>':'')+'</div>';
}
function chipsTec(){
  var h='<div class="chips"><button class="chip'+(fTec===''?' on':'')+'" data-tec="">Todos</button>';
  D.tecnicos.forEach(function(t){h+='<button class="chip'+(fTec===t?' on':'')+'" data-tec="'+esc(t)+'">'+esc(t)+'</button>';});
  return h+'</div>';
}

/* ---------- telas ---------- */
function telaPainel(){
  var todos=itens();
  var eq=resumoEquipe(todos),oc=ociosos(eq);
  var seg='<div class="pseg"><button data-pv="tec" class="'+(pv==='tec'?'on':'')+'">👤 Por técnico</button><button data-pv="cli" class="'+(pv==='cli'?'on':'')+'">🏢 Por cliente</button><button data-pv="eq" class="'+(pv==='eq'?'on':'')+'">👥 Equipe</button></div>';
  var alerta=oc.length?'<div class="alerta">⚠ Sem demanda para hoje: '+oc.map(function(e){return esc(e.tec)+(e.estado==='atrasada'?' (só atrasadas)':'');}).join(', ')+'</div>':'';
  if(pv==='eq'){
    var totFe=eq.reduce(function(a,e){return a+e.feitas;},0);
    var h=seg+alerta+'<div class="stats"><div class="stat org"><b>'+eq.reduce(function(a,e){return a+e.hoje;},0)+'</b><span>Pendentes hoje</span></div><div class="stat blu"><b>'+totFe+'</b><span>Feitas hoje</span></div><div class="stat red"><b>'+eq.reduce(function(a,e){return a+e.atrasadas;},0)+'</b><span>Atrasadas</span></div></div>';
    eq.slice().sort(function(a,b){var o={sem:0,livre:1,atrasada:1,ocupado:2,terminou:3};return o[a.estado]-o[b.estado]||a.tec.localeCompare(b.tec,'pt-BR');}).forEach(function(e){
      var tag={ocupado:'<span class="badge org">Em campo</span>',terminou:'<span class="badge grn">✔ Terminou</span>',livre:'<span class="badge red">Livre hoje</span>',atrasada:'<span class="badge red">Nada hoje · só atrasadas</span>',sem:'<span class="badge red">SEM DEMANDA</span>'}[e.estado];
      h+='<div class="eqc '+e.estado+'" data-eqtec="'+esc(e.tec)+'"><div class="n"><span>👤 '+esc(e.tec)+'</span>'+tag+'</div><div class="m"><span><b>'+e.hoje+'</b> hoje</span><span><b>'+e.feitas+'</b> feitas</span><span><b style="color:'+(e.atrasadas?'var(--red)':'inherit')+'">'+e.atrasadas+'</b> atrasadas</span>'+(e.proximo?'<span>próx. <b>'+curto(e.proximo)+'</b></span>':'')+'</div></div>';
    });
    return h+'<div class="hint" style="margin-top:6px">Toque num técnico para ver as demandas dele.</div>';
  }
  var all=todos.filter(function(i){return !fTec||i.tec===fTec;});
  var atr=all.filter(function(i){return !i.done&&diff(i.data)<0;});
  var hj=all.filter(function(i){return diff(i.data)===0;});
  var fut=all.filter(function(i){return !i.done&&diff(i.data)>0;});
  var prox={};fut.forEach(function(i){var d=diff(i.data);if(prox[i.tec]===undefined||d<prox[i.tec])prox[i.tec]=d;});
  var proximos=fut.filter(function(i){return diff(i.data)===prox[i.tec];});
  var feitas=hj.filter(function(i){return i.done;}).length;
  var h2=seg+alerta+chipsTec()+'<div class="stats"><div class="stat red"><b>'+atr.length+'</b><span>Atrasadas</span></div><div class="stat org"><b>'+(hj.length-feitas)+'</b><span>Hoje</span></div><div class="stat blu"><b>'+feitas+'</b><span>Feitas hoje</span></div></div>';
  function bloco(tit,cls,l){
    if(!l.length)return '';
    var x='<div class="sec '+cls+'">'+tit+' <span class="n">'+l.length+'</span></div>';
    if(pv==='cli'){
      var g={};l.forEach(function(i){(g[i.cli]=g[i.cli]||[]).push(i);});
      Object.keys(g).sort(function(a,b){return a.localeCompare(b,'pt-BR');}).forEach(function(c){x+='<div class="tech"><span>🏢 '+esc(c)+'</span><span>'+g[c].length+'</span></div>'+g[c].map(cardItem).join('');});
    } else {
      porTecnico(l).forEach(function(g){x+='<div class="tech"><span>👤 '+esc(g.n)+'</span><span>'+g.l.length+'</span></div>'+g.l.map(cardItem).join('');});
    }
    return x;
  }
  h2+=bloco('⚠ Atrasadas','red',atr)+bloco('📅 Hoje','',hj)+bloco('➡ Próximo dia de cada técnico','',proximos);
  if(!atr.length&&!hj.length&&!proximos.length)h2+='<div class="empty">Nada pendente 🎉</div>';
  return h2;
}
function listaDemandas(){
  var q=busca.trim().toLowerCase();
  return D.demandas.filter(function(d){
    if(fTec&&tecsExec(d).split(', ').indexOf(fTec)===-1)return false;
    if(fStatus==='abertas'&&d.status!=='Em andamento')return false;
    if(fStatus==='concluidas'&&d.status!=='Concluída')return false;
    if(q&&(d.cliente+' '+d.equipamento+' '+tecsExec(d)+' '+d.solicitante+' '+d.obs).toLowerCase().indexOf(q)===-1)return false;
    return true;
  }).sort(function(a,b){return (a.dataPrev||'9999').localeCompare(b.dataPrev||'9999');});
}
function cardDem(d){
  var df=d.dataPrev?diff(d.dataPrev):0,done=d.status==='Concluída',canc=d.status==='Cancelado';

  return '<div class="'+cls+'" data-open="'+esc(d.id)+'"><div class="t1"><div class="cli">'+esc(d.cliente)+'</div>'+b+'</div><div class="sub">'+esc(d.equipamento||'')+' · 👤 '+esc(tecsExec(d))+'</div>'
   +'<div class="sub">'+esc(d.tipo||'')+(d.dataPrev?' · entrega '+br(d.dataPrev):'')+'</div></div>';

function telaCal(){

  var h=chipsTec()+'<div class="cal-h"><button data-cm="-1">‹</button><b>'+MESES[calMes.m]+' '+calMes.a+'</b><button data-cm="1">›</button></div><div class="cal">';
  DIAS.forEach(function(d){h+='<div class="w">'+d+'</div>';});

  h+='</div><div class="sec" style="margin-top:16px">'+curto(calSel)+' <span class="n">'+(por[calSel]||[]).length+'</span></div>';

  return h;

function toggleSrv(sid){
  var s=D.servicos.find(function(x){return x.id===sid;});if(!s)return;
  var novo=s.status==='Concluída'?'Em andamento':'Concluída';
  chk(sb.from('servicos').update({status:novo}).eq('id',sid).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    s.status=novo;
    var d=D.demandas.find(function(x){return x.id===s.demandaId;});
    var p=Promise.resolve();
    if(d&&d.servicoUnico){
      var todos=D.servicos.filter(function(x){return x.demandaId===d.id;}).every(function(x){return x.status==='Concluída';});
      var ns=todos&&d.status==='Em andamento'?'Concluída':(!todos&&d.status==='Concluída'?'Em andamento':null);
      if(ns)p=chk(sb.from('demandas').update({status:ns}).eq('id',d.id)).then(function(){d.status=ns;});
    } else if(d){
      var restam=D.servicos.some(function(x){return x.demandaId===d.id&&x.status!=='Concluída'&&x.status!=='Cancelado';});
      var ns2=null;
      if(novo==='Concluída'&&!restam&&d.status==='Em andamento'){
        if(confirm('Último serviço concluído — '+d.cliente+'.\n\nNão há mais serviços a executar.\n\nOK = dar baixa e marcar a demanda como CONCLUÍDA.\nCancelar = manter em andamento (para lançar mais serviços).'))ns2='Concluída';
      } else if(novo!=='Concluída'&&d.status==='Concluída')ns2='Em andamento';
      if(ns2)p=chk(sb.from('demandas').update({status:ns2}).eq('id',d.id)).then(function(){d.status=ns2;});
    }
    return p.then(function(){abrirDem(s.demandaId,'srv');render();toast(d&&d.status==='Concluída'&&novo==='Concluída'?'Demanda concluída ✔':(novo==='Concluída'?'Serviço concluído ✔':'Serviço reaberto'));});
  }).catch(function(e){toast('⚠ '+erro(e),4000);});
}

function addServico(){
  var id=$('sheet').getAttribute('data-id'),data=$('s-data').value,desc=$('s-desc').value.trim(),tecs=escolhidos('pk-srv');
  if(!data){toast('Informe a data.');return;}
  if(!desc){toast('Descreva o serviço.');return;}
  if(!tecs.length){toast('Escolha pelo menos um técnico.');return;}
  var b=$('s-add');
  if(svEdit){
    var se=D.servicos.find(function(x){return x.id===svEdit;});if(!se){svEdit=null;return;}
    var fica=tecs.indexOf(se.tecnico)!==-1?se.tecnico:tecs[0];
    var extras=tecs.filter(function(t){return t!==fica&&!D.servicos.some(function(x){return x.id!==se.id&&x.demandaId===id&&x.data===data&&x.tecnico===t&&x.descricao===desc;});});
    var novas=extras.map(function(t){return{id:uuid(),demanda_id:id,data:data,tecnico:t,descricao:desc,status:'Em andamento'};});
    b.disabled=true;
    chk(sb.from('servicos').update({data:data,descricao:desc,tecnico:fica}).eq('id',se.id).select('id')).then(function(r){
      if(!r.data.length)throw new Error('Você não tem permissão para isso.');
      se.data=data;se.descricao=desc;se.tecnico=fica;
      return novas.length?chk(sb.from('servicos').insert(novas)).then(function(){novas.forEach(function(x){D.servicos.push(mapSrv(x));});}):null;
    }).then(function(){
      var d=D.demandas.find(function(x){return x.id===id;});
      if(novas.length&&d&&d.servicoUnico&&d.status==='Concluída'){return chk(sb.from('demandas').update({status:'Em andamento'}).eq('id',id)).then(function(){d.status='Em andamento';});}
    }).then(function(){
      svEdit=null;abrirDem(id,'srv');render();toast(extras.length?'Serviço atualizado e incluído para '+extras.join(', ')+' ✔':'Serviço atualizado ✔');
    }).catch(function(e){toast('⚠ '+erro(e),5000);b.disabled=false;});
    return;
  }
  var rows=tecs.map(function(t){return{id:uuid(),demanda_id:id,data:data,tecnico:t,descricao:desc,status:'Em andamento'};});
  b.disabled=true;
  chk(sb.from('servicos').insert(rows)).then(function(){
    rows.forEach(function(r){D.servicos.push(mapSrv(r));});
    abrirDem(id,'srv');render();toast('Serviço lançado para '+tecs.join(', ')+' ✔');
  }).catch(function(e){toast('⚠ '+erro(e),5000);b.disabled=false;});
}

function enviarLanc(ev){
  ev.preventDefault();
  var cli=$('l-cli').value.trim();
  if(D.clientes.indexOf(cli)===-1){toast('Escolha um cliente da lista cadastrada.',3500);return;}
  var prev=$('l-prev').value,obs=$('l-obs').value.trim(),equip=$('l-equip').value.trim()||'Empilhadeira',atend=$('l-atend').value,execs=escolhidos('pk-unico'),unico=$('l-unico').checked;
  if(!atend){toast('Informe a data do serviço.');return;}
  if(!execs.length){toast('Escolha quem executa o serviço.');return;}
  var desc=$('l-desc').value.trim()||obs||($('l-tipo').value+' — '+equip);
  var row={id:uuid(),cliente:cli,canal:$('l-canal').value,solicitante:$('l-sol').value.trim()||'-',tecnico:execs[0],tipo:$('l-tipo').value,
    equipamento:equip,obs_tecnicas:obs||null,data_cad:hoje(),data_atend:atend,data_prev:prev,
    status:'Em andamento',recorrente:false,rec_dia:null,grupo_recorrencia:null,usa_servicos:true,servico_unico:unico};
  var btn=$('l-btn');
  function mkRows(demId){return execs.map(function(t){return{id:uuid(),demanda_id:demId,data:atend,tecnico:t,descricao:desc,status:'Em andamento'};});}
  function fim(msg){var f=$('f-lanc');if(f)f.remove();fecharSheet();fTec='';tab='painel';pv='tec';render();toast(msg,3200);}
  function criar(){
    btn.disabled=true;btn.textContent='Enviando...';
    chk(sb.from('demandas').insert(row)).then(function(){
      D.demandas.unshift(mapDem(row));var rows=mkRows(row.id);
      return chk(sb.from('servicos').insert(rows)).then(function(){rows.forEach(function(r){D.servicos.push(mapSrv(r));});});
    }).then(function(){fim((unico?'Serviço único':'Demanda')+' lançado(a) para '+execs.join(', ')+' ✔');})
    .catch(function(e){toast('⚠ '+erro(e),5000);btn.disabled=false;btn.textContent='Lançar demanda';});
  }
  function adicionar(demId){
    var rows=mkRows(demId);
    chk(sb.from('servicos').insert(rows)).then(function(){rows.forEach(function(r){D.servicos.push(mapSrv(r));});fim('Serviço adicionado à demanda em andamento ✔');})
    .catch(function(e){toast('⚠ '+erro(e),5000);});
  }
  var abertas=D.demandas.filter(function(d){return d.cliente===cli&&d.status==='Em andamento';});
  if(abertas.length){pendDup={criar:criar,adicionar:adicionar};abrirDup(cli,abertas);return;}
  criar();
}

function comprimirImg(file){
  return new Promise(function(resolve){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return resolve({blob:file,mime:file.type,nome:file.name});
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);
        if(b&&b.size<file.size)resolve({blob:b,mime:'image/jpeg',nome:file.name.replace(/\.[^.]+$/,'')+'.jpg'});
        else resolve({blob:file,mime:file.type,nome:file.name});},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve({blob:file,mime:file.type,nome:file.name});};
    img.src=url;
  });
}
function nomeSeg(n){return String(n||'arquivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);}
function subirRh(fileList){
  var cx=rhCtx;if(!cx)return;
  var lista=[].slice.call(fileList);if(!lista.length)return;
  var tipo=$('rh-cat').value,comp=$('rh-comp').value||null,desc=$('rh-desc').value.trim()||null,feitos=0;
  toast('Enviando…',60000);
  function prox(){
    if(!lista.length)return Promise.resolve();
    var f=lista.shift();
    return comprimirImg(f).then(function(o){
      if(o.blob.size>15*1048576)throw new Error('"'+f.name+'" passa de 15 MB.');
      var caminho=cx.ent+'/'+cx.id+'/'+uuid()+'-'+nomeSeg(o.nome);
      return chk(sb.storage.from('rh-arquivos').upload(caminho,o.blob,{contentType:o.mime||'application/octet-stream',upsert:false})).then(function(){
        return chk(sb.from('rh_arquivos').insert({entidade:cx.ent,entidade_id:cx.id,categoria:tipo,descricao:desc,competencia:comp,nome_arquivo:o.nome,caminho:caminho,mime:o.mime,tamanho:o.blob.size,enviado_por:perfil?perfil.nome:null}).select());
      }).then(function(r){RH.arq.unshift(r.data[0]);feitos++;if(rhCtx&&$('rh-arqs'))$('rh-arqs').innerHTML=arqsRhHtml();});
    }).then(prox);
  }
  prox().then(function(){toast('✔ '+feitos+' arquivo(s) guardado(s)');}).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function abrirArqRh(id){
  var a=RH.arq.filter(function(x){return x.id===id;})[0];if(!a)return;
  var w=window.open('','_blank');
  chk(sb.storage.from('rh-arquivos').createSignedUrl(a.caminho,300)).then(function(r){
    var u=r.data.signedUrl||r.data.signedURL;if(w)w.location.href=u;else location.href=u;
  }).catch(function(e){if(w)w.close();toast('⚠ '+erro(e),4000);});
}
function excluirArqRh(id){
  var a=RH.arq.filter(function(x){return x.id===id;})[0];if(!a)return;
  if(!confirm('Excluir este arquivo da pasta? Não dá para desfazer.'))return;
  chk(sb.storage.from('rh-arquivos').remove([a.caminho])).then(function(){return chk(sb.from('rh_arquivos').delete().eq('id',id).select());}).then(function(){
    RH.arq=RH.arq.filter(function(x){return x.id!==id;});if($('rh-arqs'))$('rh-arqs').innerHTML=arqsRhHtml();
  }).catch(function(e){toast('⚠ '+erro(e),4000);});
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-rhv],[data-rhopen],[data-rh-abrir],[data-rh-del],[data-rhall],[data-pv],[data-eqtec],[data-dup-add],#dup-criar,[data-edit-srv],#s-cancel,[data-view],[data-del-srv],[data-del-dem],[data-pick],[data-modo],#s-add,[data-open],[data-tec],[data-st],[data-cm],[data-dia],[data-srv],[data-st-set],#fechar,#nav button');if(!t)return;
  if(t.id==='fechar'){fecharSheet();return;}
  if(t.hasAttribute('data-rhv')){rhV=t.getAttribute('data-rhv');render();return;}
  if(t.hasAttribute('data-rhall')){rhTodos=!rhTodos;render();return;}
  if(t.hasAttribute('data-rhopen')){var pr=t.getAttribute('data-rhopen').split(':');abrirPastaRh(pr[0],pr[1]);return;}
  if(t.hasAttribute('data-rh-abrir')){abrirArqRh(t.getAttribute('data-rh-abrir'));return;}
  if(t.hasAttribute('data-rh-del')){excluirArqRh(t.getAttribute('data-rh-del'));return;}
  if(t.id==='s-add'){addServico();return;}
  if(t.hasAttribute('data-pv')){pv=t.getAttribute('data-pv');render();return;}
  if(t.hasAttribute('data-eqtec')){fTec=t.getAttribute('data-eqtec');pv='tec';render();return;}
  if(t.hasAttribute('data-dup-add')){var pd=pendDup;pendDup=null;if(pd)pd.adicionar(t.getAttribute('data-dup-add'));return;}
  if(t.id==='dup-criar'){var pc=pendDup;pendDup=null;fecharSheet();if(pc)pc.criar();return;}
  if(t.hasAttribute('data-edit-srv')){svEdit=t.getAttribute('data-edit-srv');abrirDem($('sheet').getAttribute('data-id'),'srv');var a=$('addsrv');if(a)a.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(t.id==='s-cancel'){svEdit=null;abrirDem($('sheet').getAttribute('data-id'),'srv');return;}
  if(t.hasAttribute('data-view')){abrirDem($('sheet').getAttribute('data-id'),t.getAttribute('data-view'));return;}
  if(t.hasAttribute('data-del-srv')){excluirSrv(t.getAttribute('data-del-srv'));return;}
  if(t.hasAttribute('data-del-dem')){excluirDem();return;}
  if(t.hasAttribute('data-pick')){
    if(!t.classList.contains('on')&&t.parentNode.querySelectorAll('.chip.on').length>=4){toast('Máximo de 4 técnicos.');return;}
    t.classList.toggle('on');return;
  }
  if(t.hasAttribute('data-t')){ir(t.getAttribute('data-t'));return;}
  if(t.hasAttribute('data-tec')){fTec=t.getAttribute('data-tec');render();return;}
  if(t.hasAttribute('data-st')){fStatus=t.getAttribute('data-st');render();return;}
  if(t.hasAttribute('data-cm')){var n=+t.getAttribute('data-cm');calMes.m+=n;if(calMes.m>11){calMes.m=0;calMes.a++;}if(calMes.m<0){calMes.m=11;calMes.a--;}render();return;}
  if(t.hasAttribute('data-dia')){calSel=t.getAttribute('data-dia');render();return;}
  if(t.hasAttribute('data-srv')){toggleSrv(t.getAttribute('data-srv'));return;}
  if(t.hasAttribute('data-st-set')){setStatusDem($('sheet').getAttribute('data-id'),t.getAttribute('data-st-set'));return;}
  if(t.hasAttribute('data-open')){abrirDem(t.getAttribute('data-open'));return;}
});
$('sheet-bg').addEventListener('click',function(e){if(e.target===this)fecharSheet();});

document.addEventListener('submit',function(e){if(e.target.id==='f-lanc')enviarLanc(e);if(e.target.id==='f-edit')salvarEdicao(e);});
$('b-reload').addEventListener('click',function(){carregar().then(function(){return temRh()?carregarRh():null;}).then(function(){render();toast('Atualizado');}).catch(function(e){toast('⚠ '+erro(e),4000);});});
$('b-sair').addEventListener('click',function(){if(confirm('Sair do aplicativo?'))sb.auth.signOut().finally(function(){location.reload();});});

/* ---------- login / sessão ---------- */
function mostrarLogin(msg){$('app').classList.remove('on');$('login').classList.remove('off');var b=$('lg-err');b.textContent=msg||'';b.style.display=msg?'block':'none';$('lg-btn').disabled=false;$('lg-btn').textContent='Entrar';}
function entrar(session){
  return chk(sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle()).then(function(r){
    if(!r.data)throw new Error('Seu usuário não tem cadastro no sistema. Fale com o administrador.');
    if(!r.data.ativo)throw new Error('Seu acesso está desativado. Fale com o administrador.');
    perfil=r.data;return carregar();
  }).then(function(){
    aplicarSetores();return temRh()?carregarRh().catch(function(e){console.error(e);}):null;
  }).then(function(){
    $('login').classList.add('off');$('app').classList.add('on');render();ligarTempoReal();
  });
}
function ligarTempoReal(){
  if(rtLigado)return;rtLigado=true;
  function recarregar(){clearTimeout(rtTimer);rtTimer=setTimeout(function(){carregar().then(function(){return temRh()?carregarRh():null;}).then(function(){if(!document.querySelector('#sheet-bg.on'))render();}).catch(function(){});},800);}
  sb.channel('pls-mobile').on('postgres_changes',{event:'*',schema:'public'},recarregar).subscribe();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)recarregar();});
}
$('lg-btn').addEventListener('click',function(){
  var em=$('lg-email').value.trim(),se=$('lg-senha').value;
  if(!em||!se){mostrarLogin('Informe e-mail e senha.');return;}
  $('lg-btn').disabled=true;$('lg-btn').textContent='Entrando...';
  sb.auth.signInWithPassword({email:em,password:se}).then(function(r){
    if(r.error)throw new Error(/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':r.error.message);
    return entrar(r.data.session);
  }).catch(function(e){sb.auth.signOut();mostrarLogin(erro(e));});
});
$('lg-senha').addEventListener('keydown',function(e){if(e.key==='Enter')$('lg-btn').click();});
sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session)entrar(r.data.session).catch(function(e){mostrarLogin(erro(e));});else mostrarLogin('');
});
