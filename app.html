<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLS Demandas</title>
<link rel="manifest" href="manifest-app.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a1b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PLS Demandas">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--dark:#1a1b1f;--acc:#ea580c;--red:#dc2626;--grn:#16a34a;--blu:#2563eb;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
#login{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;justify-content:center;padding:28px;z-index:50}
#login.off{display:none}
#login img{width:84px;height:84px;border-radius:18px;margin:0 auto 14px;display:block}
#login h1{color:#fff;text-align:center;font-size:20px;margin:0 0 4px}
#login p.s{color:#94a3b8;text-align:center;margin:0 0 22px;font-size:13px}
#login input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f1013;color:#fff;margin-bottom:10px;font-size:16px}
#login button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
#login .err{background:#7f1d1d;color:#fecaca;padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
header{background:var(--dark);color:#fff;padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
header h1{font-size:16px;margin:0;flex:1}
header small{display:block;font-weight:400;color:#94a3b8;font-size:11px}
header button{background:#2a2c33;border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:15px}
#sync{width:9px;height:9px;border-radius:50%;background:#22c55e}
#sync.bad{background:#ef4444}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
nav button span.i{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:700}
nav button.add span.i{background:var(--acc);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 3px 8px rgba(234,88,12,.4);font-size:26px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.sec{margin:14px 0 6px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sec .n{background:var(--dark);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px}
.sec.red{color:var(--red)}.sec.red .n{background:var(--red)}
.sec.grn{color:var(--grn)}
.tech{font-weight:700;font-size:13px;margin:10px 0 4px;color:var(--mut);display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-left:4px solid #94a3b8;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.late{border-left-color:var(--red);background:#fef2f2}
.card.today{border-left-color:var(--acc)}
.card.done{border-left-color:var(--grn);background:#f0fdf4}
.card.canc{opacity:.55}
.card .t1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .cli{font-weight:700;line-height:1.25}
.card .sub{color:var(--mut);font-size:13px;margin-top:2px}
.card .task{margin-top:5px;font-size:14px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e2e8f0;white-space:nowrap}
.badge.red{background:#fee2e2;color:#991b1b}.badge.org{background:#ffedd5;color:#9a3412}.badge.grn{background:#dcfce7;color:#166534}.badge.blu{background:#dbeafe;color:#1e40af}
.mnrow{display:flex;gap:10px;align-items:center}.mnimg{width:54px;height:54px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:24px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--mut)}
.stat.red b{color:var(--red)}.stat.org b{color:var(--acc)}.stat.blu b{color:var(--blu)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block;text-align:left;min-height:48px}
header img{width:34px;height:34px;border-radius:8px;flex:0 0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.box{background:#fff7ed;border:1px dashed #fdba74;border-radius:12px;padding:12px;margin-bottom:12px}
.box.off{display:none}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;margin-top:10px}.chk input{width:20px;height:20px;margin-top:1px;flex:0 0 auto}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.addsrv{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
input.q,.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:16px}
input.q{margin-bottom:8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:4px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:16px}
.btn.sec2{background:#e2e8f0;color:var(--ink)}
.btn.grn{background:var(--grn)}.btn.red{background:var(--red)}
.btn:disabled{opacity:.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:17px;text-transform:capitalize}
.cal-h button{background:#fff;border:1px solid var(--line);border-radius:10px;width:42px;height:38px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .w{text-align:center;font-size:11px;color:var(--mut);padding:3px 0}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:9px;min-height:50px;padding:4px 2px;text-align:center;font-size:14px;position:relative}
.cal .d.o{background:transparent;border-color:transparent}
.cal .d.hoje{border-color:var(--acc);font-weight:800}
.cal .d.sel{background:var(--dark);color:#fff}
.cal .d .c{display:block;font-size:10px;font-weight:700;margin-top:3px;border-radius:99px;padding:0 5px;background:#e2e8f0;color:var(--ink);width:fit-content;margin-left:auto;margin-right:auto}
.cal .d .c.late{background:var(--red);color:#fff}
.cal .d.sel .c{background:#fff;color:var(--dark)}
.pseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:10px}
.pseg button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:13px;font-weight:600;color:var(--mut)}
.pseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.alerta{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.eqc{background:#fff;border:1px solid var(--line);border-left:5px solid #94a3b8;border-radius:12px;padding:11px 12px;margin-bottom:8px}
.eqc.ocupado{border-left-color:var(--acc)}.eqc.terminou{border-left-color:var(--grn);background:#f0fdf4}.eqc.ausente{border-left-color:#6366f1;background:#eef2ff}.alerta.aus{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}.eqc.livre,.eqc.sem,.eqc.atrasada{border-left-color:var(--red);background:#fef2f2}
.eqc .n{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.eqc .m{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--mut)}
.eqc .m b{color:var(--ink);font-size:15px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + var(--sab))}
.sheet h2{margin:0 0 4px;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:600}
.srv{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.srv .tx{flex:1}.srv small{color:var(--mut);display:block}
.srv button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.srv.ok{color:#166534}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}
</style>
</head>

    eq.slice().sort(function(a,b){var o={sem:0,livre:1,atrasada:1,ocupado:2,terminou:3,ausente:4};return o[a.estado]-o[b.estado]||a.tec.localeCompare(b.tec,'pt-BR');}).forEach(function(e){

    });

  }
  var all=todos.filter(function(i){return !fTec||i.tec===fTec;});

  var hj=all.filter(function(i){return diff(i.data)===0;});
  var pass=all.filter(function(i){return i.done&&diff(i.data)<0;});
  var fut=all.filter(function(i){return !i.done&&diff(i.data)>0;});
  var prox={};fut.forEach(function(i){var d=diff(i.data);if(prox[i.tec]===undefined||d<prox[i.tec])prox[i.tec]=d;});
  var proximos=fut.filter(function(i){return diff(i.data)===prox[i.tec];});
  var feitas=hj.filter(function(i){return i.done;}).length;

    }
    return x;
  }
  h2+=bloco('⚠ Atrasadas','red',atr)+bloco('📅 Hoje','',hj)+bloco('✔ Concluídas (últimos 7 dias)','',pass)+bloco('➡ Próximo dia de cada técnico','',proximos);
  if(!atr.length&&!hj.length&&!pass.length&&!proximos.length)h2+='<div class="empty">Nada pendente 🎉</div>';
  return h2;
}

function telaCal(){
  if(!calMes){var n=new Date();calMes={a:n.getFullYear(),m:n.getMonth()};}
  if(!calSel)calSel=hoje();
  var its=itens().filter(function(i){return !fTec||i.tec===fTec;});
  var por={};its.forEach(function(i){(por[i.data]=por[i.data]||[]).push(i);});
  var primeiro=new Date(calMes.a,calMes.m,1),dias=new Date(calMes.a,calMes.m+1,0).getDate();
  var h=chipsTec()+'<div class="cal-h"><button data-cm="-1">‹</button><b>'+MESES[calMes.m]+' '+calMes.a+'</b><button data-cm="1">›</button></div><div class="cal">';
  DIAS.forEach(function(d){h+='<div class="w">'+d+'</div>';});
  for(var i=0;i<primeiro.getDay();i++)h+='<div class="d o"></div>';
  for(var d=1;d<=dias;d++){
    var iso=calMes.a+'-'+pad(calMes.m+1)+'-'+pad(d),n=(por[iso]||[]).length,late=(por[iso]||[]).some(function(x){return !x.done&&diff(iso)<0;});
    h+='<div class="d'+(iso===hoje()?' hoje':'')+(iso===calSel?' sel':'')+'" data-dia="'+iso+'">'+d+(n?'<span class="c'+(late?' late':'')+'">'+n+'</span>':'')+'</div>';
  }
  h+='</div><div class="sec" style="margin-top:16px">'+curto(calSel)+' <span class="n">'+(por[calSel]||[]).length+'</span></div>';
  var l=por[calSel]||[];
  h+=l.length?porTecnico(l).map(function(g){return '<div class="tech"><span>👤 '+esc(g.n)+'</span><span>'+g.l.length+'</span></div>'+g.l.map(cardItem).join('');}).join(''):'<div class="empty">Nada neste dia.</div>';
  return h;
}

var TITULOS={parceiros:'Parceiros',painel:'Painel',demandas:'Demandas',lancar:'Lançar demanda',calendario:'Calendário',rh:'RH',checklist:'Manutenção',comercial:'Comercial'};
function render(){
  var m=$('main'),sc=m.scrollTop,foco=document.activeElement&&document.activeElement.id;
  $('h-title').childNodes[0].nodeValue=TITULOS[tab];
  $('h-sub').textContent=perfil?perfil.nome:'';
  var fn={painel:telaPainel,demandas:telaDemandas,lancar:telaLancar,calendario:telaCal,rh:telaRh,checklist:telaChecklist,parceiros:telaParc,comercial:PLSCOM.tela}[tab];
  if(tab==='lancar'&&document.getElementById('f-lanc'))return; /* não apaga o formulário em edição */
  m.innerHTML=(tab==='painel'&&pode('lancar')?'<button type="button" class="btn" data-golancar="1" style="margin-bottom:10px">＋ Lançar demanda</button>':'')+fn();m.scrollTop=sc;
  if(foco==='busca'){var b=$('busca');if(b){b.focus();var v=b.value;b.value='';b.value=v;}}
  [].forEach.call(document.querySelectorAll('#nav button'),function(b){b.classList.toggle('on',b.getAttribute('data-t')===(tab==='lancar'||tab==='demandas'?'painel':tab));});
}
function ir(t){pendDup=null;tab=t;if(t==='parceiros'&&temParc())carregarParc().then(function(){if(tab==='parceiros')render();}).catch(function(e){toast('⚠ '+erro(e),4000);});if(t==='rh'&&temRh())carregarRh().then(function(){if(tab==='rh'&&!document.querySelector('#sheet-bg.on'))render();}).catch(function(e){toast('⚠ '+erro(e),4000);});if(t==='lancar'){var f=$('f-lanc');if(f)f.remove();lancModo='simples';}$('main').scrollTop=0;render();}

function selOpts(lista,atual,ph){
  var l=lista.slice();if(atual&&l.indexOf(atual)===-1)l.push(atual);
  return (ph?'<option value="">'+ph+'</option>':'')+l.map(function(x){return '<option'+(x===atual?' selected':'')+'>'+esc(x)+'</option>';}).join('');
}
function abrirDem(id,view){

  view=view||'dem';if(view!=='srv')svEdit=null;

    if(!srv.length)h+='<div class="empty" style="padding:14px">Nenhum serviço lançado ainda.</div>';

       +(ed?'<button data-srv="'+esc(s.id)+'">'+(feito?'↩':'✔')+'</button>':(feito?'✔':''))
       +(ed||pode('lancar')?'<button data-edit-srv="'+esc(s.id)+'">✏️</button>':'')
       +(ed||pode('lancar')?'<button data-del-srv="'+esc(s.id)+'" style="color:var(--red)">🗑</button>':'')+'</div>';});
    if(ed||pode('lancar')){

      if(svEdit&&!se)svEdit=null;
      h+='<div class="addsrv" id="addsrv"><div class="sec" style="margin:0 0 8px">'+(se?'✏️ Editar serviço de '+esc(se.tecnico||'')+' — '+curto(se.data):'＋ Lançar serviço')+'</div>'
       +'<div class="fld"><label>Data</label><input id="s-data" type="date" value="'+(se?esc(se.data):hoje())+'"></div>'
       +'<div class="fld"><label>Serviço</label><input id="s-desc" placeholder="O que será feito" value="'+(se?esc(se.descricao):'')+'"></div>'
       +'<div class="fld"><label>'+(se?'Técnicos (toque para incluir mais, até 4)':'Quem executa (até 4)')+'</label>'+picker('pk-srv',se?[se.tecnico]:(d.usaServicos?[]:(d.tecnico?[d.tecnico]:[])))+'</div>'
       +(se?'<div class="hint">Os técnicos incluídos recebem o mesmo serviço e o mesmo dia.</div>':'')
       +'<button class="btn" type="button" id="s-add">'+(se?'💾 Salvar alteração':'Lançar serviço')+'</button>'
       +(se?'<button class="btn sec2" type="button" id="s-cancel" style="margin-top:8px">Cancelar edição</button>':'')+'</div>';
    }
  } else if(view==='edit'){

     +'<div class="fld"><label>Canal *</label><select id="e-canal" required>'+selOpts(D.canais,d.canal)+'</select></div></div>'
     +'<div class="fld"><label>Data prevista de entrega</label><input id="e-prev" type="date" value="'+esc(d.dataPrev)+'"></div>'

    if(ed)h+='<button class="btn sec2" data-view="edit">✏️ Editar</button>';
    if(ed){
      if(d.status==='Em andamento')h+='<button class="btn grn" data-st-set="Concluída">✔ Concluir demanda</button><button class="btn sec2" data-st-set="Cancelado">Cancelar demanda</button>';
      else h+='<button class="btn" data-st-set="Em andamento">↩ Reabrir demanda</button>';
    }
    if(pode('excluir'))h+='<button class="btn sec2" style="color:var(--red)" data-del-dem="1">🗑 Excluir demanda</button>';

  var sh=$('sheet');sh.innerHTML=h;sh.setAttribute('data-id',id);sh.setAttribute('data-cur',view);$('sheet-bg').classList.add('on');

function salvarEdicao(ev){
  ev.preventDefault();
  var id=$('sheet').getAttribute('data-id'),d=D.demandas.find(function(x){return x.id===id;});if(!d)return;
  var cli=$('e-cli').value.trim();
  if(D.clientes.indexOf(cli)===-1&&cli!==d.cliente){toast('Escolha um cliente da lista cadastrada.',3500);return;}
  var ch={cliente:cli,tecnico:$('e-tec')?$('e-tec').value:d.tecnico,tipo:$('e-tipo').value,canal:$('e-canal').value,data_prev:$('e-prev').value||null,
    equipamento:$('e-equip').value.trim()||'Empilhadeira',solicitante:$('e-sol').value.trim()||'-',obs_tecnicas:$('e-obs').value.trim()||null,status:$('e-status').value};
  if($('e-atend'))ch.data_atend=$('e-atend').value||null;
  var b=$('e-btn');b.disabled=true;b.textContent='Salvando...';
  chk(sb.from('demandas').update(ch).eq('id',id).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    d.cliente=ch.cliente;d.tecnico=ch.tecnico;d.tipo=ch.tipo;d.canal=ch.canal;d.dataPrev=ch.data_prev||'';d.equipamento=ch.equipamento;d.solicitante=ch.solicitante;d.obs=ch.obs_tecnicas||'';d.status=ch.status;
    if('data_atend' in ch)d.dataAtend=ch.data_atend||'';
    toast('Alterações salvas ✔');abrirDem(id);render();
  }).catch(function(e){toast('⚠ '+erro(e),5000);b.disabled=false;b.textContent='💾 Salvar alterações';});
}
function excluirDem(){
  var id=$('sheet').getAttribute('data-id');
  if(!confirm('Deseja realmente excluir esta demanda e seus serviços?'))return;
  chk(sb.from('servicos').delete().eq('demanda_id',id)).then(function(){return chk(sb.from('demandas').delete().eq('id',id).select('id'));}).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    D.demandas=D.demandas.filter(function(x){return x.id!==id;});D.servicos=D.servicos.filter(function(x){return x.demandaId!==id;});
    fecharSheet();render();toast('Demanda excluída.');
  }).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function excluirSrv(sid){
  var sv=D.servicos.find(function(x){return x.id===sid;});if(!sv)return;
  if(!confirm('Excluir este serviço?'))return;
  chk(sb.from('servicos').delete().eq('id',sid).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    D.servicos=D.servicos.filter(function(x){return x.id!==sid;});abrirDem(sv.demandaId,'srv');render();toast('Serviço excluído.');
  }).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function abrirAus(tec){
  var h=hoje(),lst=(D.ausencias||[]).filter(function(a){return a.tec===tec&&a.fim>=h;}).sort(function(a,b){return a.ini.localeCompare(b.ini);});
  var x='<h2>🏖 Ausência — '+esc(tec)+'</h2><div class="sub" style="color:var(--mut);margin:4px 0 10px">Enquanto estiver ausente, o técnico não aparece como "sem demanda".</div>'
   +'<div class="fld"><label>Motivo</label><select id="au-tipo">'+AUS_TIPOS.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div>'
   +'<div class="fld"><label>De</label><input type="date" id="au-ini" value="'+h+'"></div><div class="fld"><label>Até</label><input type="date" id="au-fim" value="'+h+'"></div>'
   +'<div class="fld"><label>Observação</label><input type="text" id="au-obs" placeholder="Opcional"></div>'
   +'<button class="btn" id="aus-salvar">Salvar ausência</button>';
  if(lst.length){x+='<div class="sub" style="margin:14px 0 6px;font-weight:700">Lançadas</div>'+lst.map(function(a){return '<div class="card"><div class="t1"><div class="cli">'+esc(a.tipo)+'</div><button class="chip" data-aus-del="'+esc(a.id)+'">Excluir</button></div><div class="sub">'+br(a.ini)+(a.fim!==a.ini?' a '+br(a.fim):'')+(a.obs?' · '+esc(a.obs):'')+'</div></div>';}).join('');}
  x+='<button class="btn sec2" style="margin-top:10px" id="fechar">Fechar</button>';
  var sh=$('sheet');sh.innerHTML=x;sh.setAttribute('data-id',tec);sh.setAttribute('data-cur','aus');$('sheet-bg').classList.add('on');
}
function salvarAus(){
  var tec=$('sheet').getAttribute('data-id'),ini=$('au-ini').value,fim=$('au-fim').value||ini;
  if(!ini){toast('Informe a data.');return;}
  if(fim<ini){toast('A data final é antes da inicial.');return;}
  var conf=itens().filter(function(i){return i.tec===tec&&!i.done&&i.data>=ini&&i.data<=fim;});
  if(conf.length){toast('⚠ '+tec+' tem '+conf.length+' serviço(s) em andamento nesse período. Passe para outro técnico antes de lançar a ausência.',6000);return;}
  var row={id:uuid(),tecnico:tec,data_ini:ini,data_fim:fim,tipo:$('au-tipo').value,obs:$('au-obs').value.trim()||null};
  chk(sb.from('tec_ausencias').insert(row).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    (D.ausencias=D.ausencias||[]).push({id:row.id,tec:tec,ini:ini,fim:fim,tipo:row.tipo,obs:row.obs||''});
    fecharSheet();render();toast('Ausência registrada.');
  }).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function delAus(id){
  if(!confirm('Excluir esta ausência?'))return;
  var a=(D.ausencias||[]).find(function(x){return x.id===id;});
  chk(sb.from('tec_ausencias').delete().eq('id',id).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    D.ausencias=D.ausencias.filter(function(x){return x.id!==id;});if(a)abrirAus(a.tec);render();
  }).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function fecharSheet(){$('sheet-bg').classList.remove('on');if(rhCtx){rhCtx=null;if(tab==='rh')render();}}
function setStatusDem(id,st){
  var btns=[].slice.call(document.querySelectorAll('#sheet .btn'));btns.forEach(function(b){b.disabled=true;});
  chk(sb.from('demandas').update({status:st}).eq('id',id).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    D.demandas.forEach(function(d){if(d.id===id)d.status=st;});
    toast(st==='Concluída'?'Demanda concluída ✔':st==='Cancelado'?'Demanda cancelada':'Demanda reaberta');fecharSheet();render();
  }).catch(function(e){toast('⚠ '+erro(e),4000);btns.forEach(function(b){b.disabled=false;});});
}
function toggleSrv(sid){
  var s=D.servicos.find(function(x){return x.id===sid;});if(!s)return;
  var novo=s.status==='Concluída'?'Em andamento':'Concluída';
  chk(sb.from('servicos').update({status:novo}).eq('id',sid).select('id')).then(function(r){
    if(!r.data.length)throw new Error('Você não tem permissão para isso.');
    s.status=novo;
    var d=D.demandas.find(function(x){return x.id===s.demandaId;});
    var p=Promise.resolve();
    if(d&&d.servicoUnico){
      var todos=D.servicos.filter(function(x){return x.demandaId===d.id;}).every(function(x){return x.status==='Concluída';});
      var ns=todos&&d.status==='Em andamento'?'Concluída':(!todos&&d.status==='Concluída'?'Em andamento':null);
      if(ns)p=chk(sb.from('demandas').update({status:ns}).eq('id',d.id)).then(function(){d.status=ns;});
    } else if(d){
      var restam=D.servicos.some(function(x){return x.demandaId===d.id&&x.status!=='Concluída'&&x.status!=='Cancelado';});
      var ns2=null;
      if(novo==='Concluída'&&!restam&&d.status==='Em andamento'){
        if(confirm('Último serviço concluído — '+d.cliente+'.\n\nNão há mais serviços a executar.\n\nOK = dar baixa e marcar a demanda como CONCLUÍDA.\nCancelar = manter em andamento (para lançar mais serviços).'))ns2='Concluída';
      } else if(novo!=='Concluída'&&d.status==='Concluída')ns2='Em andamento';
      if(ns2)p=chk(sb.from('demandas').update({status:ns2}).eq('id',d.id)).then(function(){d.status=ns2;});
    }
    return p.then(function(){abrirDem(s.demandaId,'srv');render();toast(d&&d.status==='Concluída'&&novo==='Concluída'?'Demanda concluída ✔':(novo==='Concluída'?'Serviço concluído ✔':'Serviço reaberto'));});
  }).catch(function(e){toast('⚠ '+erro(e),4000);});
}

function addServico(){
  var id=$('sheet').getAttribute('data-id'),data=$('s-data').value,desc=$('s-desc').value.trim(),tecs=escolhidos('pk-srv');
  if(!data){toast('Informe a data.');return;}
  if(!desc){toast('Descreva o serviço.');return;}
  if(!tecs.length){toast('Escolha pelo menos um técnico.');return;}
  var b=$('s-add');
  if(svEdit){
    var se=D.servicos.find(function(x){return x.id===svEdit;});if(!se){svEdit=null;return;}
    var fica=tecs.indexOf(se.tecnico)!==-1?se.tecnico:tecs[0];
    var extras=tecs.filter(function(t){return t!==fica&&!D.servicos.some(function(x){return x.id!==se.id&&x.demandaId===id&&x.data===data&&x.tecnico===t&&x.descricao===desc;});});
    var novas=extras.map(function(t){return{id:uuid(),demanda_id:id,data:data,tecnico:t,descricao:desc,status:'Em andamento'};});
    b.disabled=true;
    chk(sb.from('servicos').update({data:data,descricao:desc,tecnico:fica}).eq('id',se.id).select('id')).then(function(r){
      if(!r.data.length)throw new Error('Você não tem permissão para isso.');
      se.data=data;se.descricao=desc;se.tecnico=fica;
      return novas.length?chk(sb.from('servicos').insert(novas)).then(function(){novas.forEach(function(x){D.servicos.push(mapSrv(x));});}):null;
    }).then(function(){
      var d=D.demandas.find(function(x){return x.id===id;});
      if(novas.length&&d&&d.servicoUnico&&d.status==='Concluída'){return chk(sb.from('demandas').update({status:'Em andamento'}).eq('id',id)).then(function(){d.status='Em andamento';});}
    }).then(function(){
      svEdit=null;abrirDem(id,'srv');render();toast(extras.length?'Serviço atualizado e incluído para '+extras.join(', ')+' ✔':'Serviço atualizado ✔');
    }).catch(function(e){toast('⚠ '+erro(e),5000);b.disabled=false;});
    return;
  }
  var rows=tecs.map(function(t){return{id:uuid(),demanda_id:id,data:data,tecnico:t,descricao:desc,status:'Em andamento'};});
  b.disabled=true;
  chk(sb.from('servicos').insert(rows)).then(function(){
    rows.forEach(function(r){D.servicos.push(mapSrv(r));});
    abrirDem(id,'srv');render();toast('Serviço lançado para '+tecs.join(', ')+' ✔');
  }).catch(function(e){toast('⚠ '+erro(e),5000);b.disabled=false;});
}

     +'<button class="btn" style="margin-top:8px;padding:11px" data-dup-add="'+esc(d.id)+'">➕ Adicionar o serviço nesta</button></div>';});
  h+='<button class="btn sec2" style="margin-top:6px" id="dup-criar">Criar nova demanda mesmo assim</button><button class="btn sec2" style="margin-top:8px" id="fechar">Voltar ao formulário</button>';

function enviarLanc(ev){
  ev.preventDefault();
  var cli=$('l-cli').value.trim();
  if(D.clientes.indexOf(cli)===-1){toast('Escolha um cliente da lista cadastrada.',3500);return;}
  var prev=$('l-prev').value,obs=$('l-obs').value.trim(),equip=$('l-equip').value.trim()||'Empilhadeira',atend=$('l-atend').value,execs=escolhidos('pk-unico'),unico=$('l-unico').checked;
  if(!atend){toast('Informe a data do serviço.');return;}
  if(!execs.length){toast('Escolha quem executa o serviço.');return;}
  var desc=$('l-desc').value.trim()||obs||($('l-tipo').value+' — '+equip);
  var row={id:uuid(),cliente:cli,canal:$('l-canal').value,solicitante:$('l-sol').value.trim()||'-',tecnico:execs[0],tipo:$('l-tipo').value,
    equipamento:equip,obs_tecnicas:obs||null,data_cad:hoje(),data_atend:atend,data_prev:prev,
    status:'Em andamento',recorrente:false,rec_dia:null,grupo_recorrencia:null,usa_servicos:true,servico_unico:unico};
  var btn=$('l-btn');
  function mkRows(demId){return execs.map(function(t){return{id:uuid(),demanda_id:demId,data:atend,tecnico:t,descricao:desc,status:'Em andamento'};});}
  function fim(msg){var f=$('f-lanc');if(f)f.remove();fecharSheet();fTec='';tab='painel';pv='tec';render();toast(msg,3200);}
  function criar(){
    btn.disabled=true;btn.textContent='Enviando...';
    chk(sb.from('demandas').insert(row)).then(function(){
      D.demandas.unshift(mapDem(row));var rows=mkRows(row.id);
      return chk(sb.from('servicos').insert(rows)).then(function(){rows.forEach(function(r){D.servicos.push(mapSrv(r));});});
    }).then(function(){fim((unico?'Serviço único':'Demanda')+' lançado(a) para '+execs.join(', ')+' ✔');})
    .catch(function(e){toast('⚠ '+erro(e),5000);btn.disabled=false;btn.textContent='Lançar demanda';});
  }
  function adicionar(demId){
    var rows=mkRows(demId);
    chk(sb.from('servicos').insert(rows)).then(function(){rows.forEach(function(r){D.servicos.push(mapSrv(r));});fim('Serviço adicionado à demanda em andamento ✔');})
    .catch(function(e){toast('⚠ '+erro(e),5000);});
  }
  var abertas=D.demandas.filter(function(d){return d.cliente===cli&&d.status==='Em andamento';});
  if(abertas.length){pendDup={criar:criar,adicionar:adicionar};abrirDup(cli,abertas);return;}
  criar();
}

  return '<div class="card" data-rhopen="'+ent+':'+x.id+'"><div class="t1"><div><div class="cli"><span class="badge '+(i.tag==='PJ'?'':'blu')+'" style="margin-right:6px">'+i.tag+'</span>'+esc(x.nome)+'</div><div class="sub">'+esc(x.funcao||(i.tag==='PJ'?'Prestador PJ':'Colaborador'))+'</div></div><span class="badge '+(n?'blu':'')+'">📁 '+n+'</span></div></div>';
}
function telaRh(){
  if(!temRh())return '<div class="empty">Você não tem acesso ao RH.</div>';
  if(!RH.ok)return '<div class="empty">Carregando…</div>';
  var l=rhLista();
  return '<input class="q" id="rh-busca" type="search" placeholder="Buscar nome..." value="'+esc(rhBusca)+'">'
   +'<div class="chips"><button class="chip'+(rhTodos?' on':'')+'" data-rhall="1">Mostrar desligados</button></div>'
   +'<div class="hint">Toque no nome para abrir a pasta e anexar foto, scanner ou PDF. CLT = colaborador · PJ = prestador.</div>'
   +'<div id="rh-lista">'+(l.length?l.map(cardRh).join(''):'<div class="empty">Ninguém encontrado.</div>')+'</div>';
}
function arqsRhHtml(){
  var l=RH.arq.filter(function(a){return rhCtx&&a.entidade===rhCtx.ent&&a.entidade_id===rhCtx.id;});

    return '<div class="srv"><div class="tx"><b>'+(/pdf/.test(a.mime||'')?'📄':'🖼')+' '+esc(a.descricao||a.nome_arquivo)+'</b><small>'+esc(nome(a.categoria))+(a.competencia?' · '+a.competencia.slice(5)+'/'+a.competencia.slice(0,4):'')+' · '+br(String(a.created_at).slice(0,10))+'</small></div><button data-rh-abrir="'+a.id+'">Abrir</button><button data-rh-del="'+a.id+'">🗑</button></div>';

function abrirPastaRh(ent,id){
  var dono=(ent==='colaborador'?RH.colab:RH.prest).filter(function(x){return x.id===id;})[0];if(!dono)return;
  rhCtx={ent:ent,id:id,nome:dono.nome};

   +'<label class="btn" style="display:block;text-align:center">📷 Tirar foto<input id="rh-cam" type="file" accept="image/*" capture="environment" hidden></label>'

   +'<div class="sec">Arquivos <span class="n" id="rh-n">0</span></div><div id="rh-arqs"></div>'

  $('rh-arqs').innerHTML=arqsRhHtml();
}
function comprimirImg(file){
  return new Promise(function(resolve){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return resolve({blob:file,mime:file.type,nome:file.name});
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,2200/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);
        if(b&&b.size<file.size)resolve({blob:b,mime:'image/jpeg',nome:file.name.replace(/\.[^.]+$/,'')+'.jpg'});
        else resolve({blob:file,mime:file.type,nome:file.name});},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve({blob:file,mime:file.type,nome:file.name});};
    img.src=url;
  });
}
function nomeSeg(n){return String(n||'arquivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-80);}
function subirRh(fileList){
  var cx=rhCtx;if(!cx)return;
  var lista=[].slice.call(fileList);if(!lista.length)return;
  var tipo=$('rh-cat').value,comp=$('rh-comp').value||null,desc=$('rh-desc').value.trim()||null,feitos=0;
  toast('Enviando…',60000);
  function prox(){
    if(!lista.length)return Promise.resolve();
    var f=lista.shift();
    return comprimirImg(f).then(function(o){
      if(o.blob.size>15*1048576)throw new Error('"'+f.name+'" passa de 15 MB.');
      var caminho=cx.ent+'/'+cx.id+'/'+uuid()+'-'+nomeSeg(o.nome);
      return chk(sb.storage.from('rh-arquivos').upload(caminho,o.blob,{contentType:o.mime||'application/octet-stream',upsert:false})).then(function(){
        return chk(sb.from('rh_arquivos').insert({entidade:cx.ent,entidade_id:cx.id,categoria:tipo,descricao:desc,competencia:comp,nome_arquivo:o.nome,caminho:caminho,mime:o.mime,tamanho:o.blob.size,enviado_por:perfil?perfil.nome:null}).select());
      }).then(function(r){RH.arq.unshift(r.data[0]);feitos++;if(rhCtx&&$('rh-arqs'))$('rh-arqs').innerHTML=arqsRhHtml();});
    }).then(prox);
  }
  prox().then(function(){toast('✔ '+feitos+' arquivo(s) guardado(s)');}).catch(function(e){toast('⚠ '+erro(e),5000);});
}
function abrirArqRh(id){
  var a=RH.arq.filter(function(x){return x.id===id;})[0];if(!a)return;
  var w=window.open('','_blank');
  chk(sb.storage.from('rh-arquivos').createSignedUrl(a.caminho,300)).then(function(r){
    var u=r.data.signedUrl||r.data.signedURL;if(w)w.location.href=u;else location.href=u;
  }).catch(function(e){if(w)w.close();toast('⚠ '+erro(e),4000);});
}
function excluirArqRh(id){
  var a=RH.arq.filter(function(x){return x.id===id;})[0];if(!a)return;
  if(!confirm('Excluir este arquivo da pasta? Não dá para desfazer.'))return;
  chk(sb.storage.from('rh-arquivos').remove([a.caminho])).then(function(){return chk(sb.from('rh_arquivos').delete().eq('id',id).select());}).then(function(){
    RH.arq=RH.arq.filter(function(x){return x.id!==id;});if($('rh-arqs'))$('rh-arqs').innerHTML=arqsRhHtml();
  }).catch(function(e){toast('⚠ '+erro(e),4000);});
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-golancar],[data-pa-orc],[data-pa-eq],[data-pa],[data-rhv],[data-rhopen],[data-rh-abrir],[data-rh-del],[data-rhall],[data-pv],[data-aus],[data-aus-del],#aus-salvar,[data-eqtec],[data-dup-add],#dup-criar,[data-edit-srv],#s-cancel,[data-view],[data-del-srv],[data-del-dem],[data-pick],[data-modo],#s-add,[data-open],[data-tec],[data-st],[data-cm],[data-dia],[data-srv],[data-st-set],#fechar,#nav button');if(!t)return;
  if(t.id==='fechar'){fecharSheet();return;}
  if(t.hasAttribute('data-golancar')){ir('lancar');return;}
  if(t.hasAttribute('data-pa-orc')){verOrcP(t.getAttribute('data-pa-orc'));return;}
  if(t.hasAttribute('data-pa-eq')){verEqP(t.getAttribute('data-pa-eq'));return;}
  if(t.hasAttribute('data-pa')){PA.sub=t.getAttribute('data-pa');render();return;}
  if(t.hasAttribute('data-rhv')){rhV=t.getAttribute('data-rhv');render();return;}
  if(t.hasAttribute('data-rhall')){rhTodos=!rhTodos;render();return;}
  if(t.hasAttribute('data-rhopen')){var pr=t.getAttribute('data-rhopen').split(':');abrirPastaRh(pr[0],pr[1]);return;}
  if(t.hasAttribute('data-rh-abrir')){abrirArqRh(t.getAttribute('data-rh-abrir'));return;}
  if(t.hasAttribute('data-rh-del')){excluirArqRh(t.getAttribute('data-rh-del'));return;}
  if(t.id==='s-add'){addServico();return;}
  if(t.hasAttribute('data-pv')){pv=t.getAttribute('data-pv');render();return;}
  if(t.hasAttribute('data-aus')){abrirAus(t.getAttribute('data-aus'));return;}
  if(t.hasAttribute('data-aus-del')){delAus(t.getAttribute('data-aus-del'));return;}
  if(t.id==='aus-salvar'){salvarAus();return;}
  if(t.hasAttribute('data-eqtec')){fTec=t.getAttribute('data-eqtec');pv='tec';render();return;}
  if(t.hasAttribute('data-dup-add')){var pd=pendDup;pendDup=null;if(pd)pd.adicionar(t.getAttribute('data-dup-add'));return;}
  if(t.id==='dup-criar'){var pc=pendDup;pendDup=null;fecharSheet();if(pc)pc.criar();return;}
  if(t.hasAttribute('data-edit-srv')){svEdit=t.getAttribute('data-edit-srv');abrirDem($('sheet').getAttribute('data-id'),'srv');var a=$('addsrv');if(a)a.scrollIntoView({behavior:'smooth',block:'center'});return;}
  if(t.id==='s-cancel'){svEdit=null;abrirDem($('sheet').getAttribute('data-id'),'srv');return;}
  if(t.hasAttribute('data-view')){abrirDem($('sheet').getAttribute('data-id'),t.getAttribute('data-view'));return;}
  if(t.hasAttribute('data-del-srv')){excluirSrv(t.getAttribute('data-del-srv'));return;}
  if(t.hasAttribute('data-del-dem')){excluirDem();return;}
  if(t.hasAttribute('data-pick')){
    if(!t.classList.contains('on')&&t.parentNode.querySelectorAll('.chip.on').length>=4){toast('Máximo de 4 técnicos.');return;}
    t.classList.toggle('on');return;
  }
  if(t.hasAttribute('data-t')){ir(t.getAttribute('data-t'));return;}
  if(t.hasAttribute('data-tec')){fTec=t.getAttribute('data-tec');render();return;}
  if(t.hasAttribute('data-st')){fStatus=t.getAttribute('data-st');render();return;}
  if(t.hasAttribute('data-cm')){var n=+t.getAttribute('data-cm');calMes.m+=n;if(calMes.m>11){calMes.m=0;calMes.a++;}if(calMes.m<0){calMes.m=11;calMes.a--;}render();return;}
  if(t.hasAttribute('data-dia')){calSel=t.getAttribute('data-dia');render();return;}
  if(t.hasAttribute('data-srv')){toggleSrv(t.getAttribute('data-srv'));return;}
  if(t.hasAttribute('data-st-set')){setStatusDem($('sheet').getAttribute('data-id'),t.getAttribute('data-st-set'));return;}
  if(t.hasAttribute('data-open')){abrirDem(t.getAttribute('data-open'));return;}
});

/* ---------- login / sessão ---------- */
function mostrarLogin(msg){$('app').classList.remove('on');$('login').classList.remove('off');var b=$('lg-err');b.textContent=msg||'';b.style.display=msg?'block':'none';$('lg-btn').disabled=false;$('lg-btn').textContent='Entrar';}
function entrar(session){
  return chk(sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle()).then(function(r){
    if(!r.data)throw new Error('Seu usuário não tem cadastro no sistema. Fale com o administrador.');
    if(!r.data.ativo)throw new Error('Seu acesso está desativado. Fale com o administrador.');
    perfil=r.data;return ehParc()?null:carregar();
  }).then(function(){
    aplicarSetores();if(temParc())return carregarParc().catch(function(e){console.error(e);});return temRh()?carregarRh().catch(function(e){console.error(e);}):null;
  }).then(function(){
    $('login').classList.add('off');$('app').classList.add('on');render();ligarTempoReal();
  });
}
function ligarTempoReal(){
  if(rtLigado)return;rtLigado=true;
  function recarregar(){clearTimeout(rtTimer);rtTimer=setTimeout(function(){atualizarTudo().then(function(){if(!document.querySelector('#sheet-bg.on'))render();}).catch(function(){});},800);}
  sb.channel('pls-mobile').on('postgres_changes',{event:'*',schema:'public'},recarregar).subscribe();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)recarregar();});
  /* parceiro não recebe eventos em tempo real (o banco não deixa ver as tabelas) — confere a cada 25 s */
  if(temParc())setInterval(function(){if(!document.hidden&&!document.querySelector('#sheet-bg.on'))recarregar();},25000);
}
$('lg-form').addEventListener('submit',function(ev){
  ev.preventDefault();
  var em=$('lg-email').value.trim(),se=$('lg-senha').value;
  if(!em||!se){mostrarLogin('Informe e-mail e senha.');return;}
  $('lg-btn').disabled=true;$('lg-btn').textContent='Entrando...';
  sb.auth.signInWithPassword({email:em,password:se}).then(function(r){
    if(r.error)throw new Error(/invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':r.error.message);
    try{localStorage.setItem('pls-email',em);if($('lg-manter').checked)localStorage.removeItem('pls-temp');else{localStorage.setItem('pls-temp','1');sessionStorage.setItem('pls-ativa','1');}}catch(x){}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(x){}
    return entrar(r.data.session);
  }).catch(function(e){sb.auth.signOut();mostrarLogin(erro(e));});
});
try{var em0=localStorage.getItem('pls-email');if(em0)$('lg-email').value=em0;if(localStorage.getItem('pls-temp'))$('lg-manter').checked=false;}catch(x){}
var sairAoAbrir=false;try{sairAoAbrir=!!localStorage.getItem('pls-temp')&&!sessionStorage.getItem('pls-ativa');}catch(x){}
sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session&&sairAoAbrir){return sb.auth.signOut().then(function(){mostrarLogin('');});}
  if(r.data&&r.data.session)entrar(r.data.session).catch(function(e){mostrarLogin(erro(e));});else mostrarLogin('');
});

      (e.serie ? '<div class="kv"><span>Nº de série</span><span>' + esc(e.serie) + '</span></div>' : '') + (e.tag ? '<div class="kv"><span>Identificação</span><span>' + esc(e.tag) + '</span></div>' : '') +
      (e.motor ? '<div class="kv"><span>Motor</span><span>' + esc(e.motor) + '</span></div>' : '') + (e.horimetro != null ? '<div class="kv"><span>Horímetro</span><span>' + esc(String(e.horimetro).replace('.', ',')) + ' h' + (e.horimetro_em ? ' (' + br(e.horimetro_em) + ')' : '') + '</span></div>' : '') +
      '<div class="hd">📁 DOCUMENTOS DO EQUIPAMENTO</div>' + (docsH || '<div class="sub">Nenhum documento ainda. Adicione abaixo o teste de opacidade, o teste de carga e outros documentos desta máquina.</div>') +
      (pec.length ? '<div class="hd">🔩 FOTOS DAS PEÇAS</div><div class="pd-pc">' + pec.map(function(p, k) { return '<div data-pc="' + k + '"><img src="' + p.foto + '" alt=""><br>' + esc(p.i || 'Peça') + (p.p ? '<br><small>' + esc(p.p) + '</small>' : '') + '</div>'; }).join('') + '</div>' : '') +
      (FORM ? form : '<button type="button" class="btn2" id="pd-add" style="margin-top:12px">➕ Adicionar documento</button>');
    ROOT.innerHTML = '<div class="pk-top"><b>📁 ' + esc(nomeEq(e)) + '</b><button type="button" id="pd-x">Fechar</button></div><div class="pk-main"><div class="pk-c">' + corpo + '</div></div><div class="pk-foot"><button type="button" class="pk-btn" id="pd-ok">Fechar</button>' + (C.onEditar ? '<button type="button" class="pk-btn g" id="pd-ed">✏ Editar cadastro</button>' : '') + '</div>';
    $('pd-x').onclick = fechar; $('pd-ok').onclick = fechar;
    var ed = $('pd-ed'); if (ed) ed.onclick = function() { var id = EQ.id; fechar(); C.onEditar(id); };
    var ft = $('pd-ft'); if (ft) ft.onclick = function() { foto(e.foto, 0, nomeEq(e) + ' — ' + (e.cliente || '')); };
    [].forEach.call(ROOT.querySelectorAll('[data-pc]'), function(d) { d.onclick = function() { foto(pec.map(function(p) { return { src: p.foto, leg: [p.i, p.p].filter(Boolean).join(' · ') }; }), +d.getAttribute('data-pc')); }; });
    var ad = $('pd-add'); if (ad) ad.onclick = function() { FORM = true; pinta(); var c = $('pd-cat'); if (c) c.scrollIntoView({ block: 'center' }); };
    ROOT.querySelector('.pk-c').onclick = function(ev) {
      var b = ev.target.closest('[data-a]'); if (b) { var d = DOCS.filter(function(x) { return x.id === b.getAttribute('data-id'); })[0]; if (!d) return; if (b.getAttribute('data-a') === 'ver') ver(d); else excluir(d); return; }
      var q = ev.target.closest('[data-q]'); if (q) { var m = +q.getAttribute('data-q'), v = $('pd-val'); if (!m) { v.value = ''; return; } var base = new Date(($('pd-data').value || U.hojeISO()) + 'T12:00:00'); base.setMonth(base.getMonth() + m); v.value = base.toISOString().slice(0, 10); }
    };

    var en = $('pd-env'); if (en) en.onclick = enviar;
  }
  function blobDeDataUrl(d) { return fetch(d).then(function(r) { return r.blob(); }); }
  function enviar() {
    var fs = [].slice.call($('pd-file').files || []); if (!fs.length) { C.toast('Escolha o arquivo (PDF ou foto) do documento.'); return; }
    var big = fs.filter(function(f) { return f.size > 25 * 1024 * 1024; })[0]; if (big) { C.toast('“' + big.name + '” passa de 25 MB. Diminua o arquivo e tente de novo.'); return; }

    b.disabled = true; b.textContent = 'Enviando…';

      return p.then(function() {
        var img = /^image\//.test(f.type) && !/gif|svg/.test(f.type);
        return (img ? U.comprimir(f, 2200, 0.82).then(blobDeDataUrl).then(function(bl) { return { bl: bl, mime: 'image/jpeg', nome: f.name.replace(/\.[^.]+$/, '') + '.jpg' }; }) : Promise.resolve({ bl: f, mime: f.type || 'application/octet-stream', nome: f.name }))
          .then(function(o) {

              return C.chk(C.sb.from('man_equip_docs').insert({ equip_id: EQ.id, categoria: catv, descricao: desc || (fs.length > 1 ? o.nome : cat(catv)[2]), data_doc: dt, validade: val, nome_arquivo: o.nome, caminho: cam, mime: o.mime, tamanho: o.bl.size || null, enviado_por: C.nome() || null }).select('id'));
            });
          });
      });
    }, Promise.resolve()).then(function() { FORM = false; return carregarDocs(); }).then(function() { pinta(); C.toast('Documento salvo na pasta do equipamento.'); })
      .catch(function(e) { b.disabled = false; b.textContent = 'Enviar para a pasta'; C.toast('Erro ao enviar: ' + (e.message || e)); });
  }
  function ver(d) {
    C.chk(C.sb.storage.from(BUCKET).createSignedUrl(d.caminho, 600)).then(function(r) {
      var u = r.data && r.data.signedUrl; if (!u) throw new Error('arquivo não encontrado');
      if (/^image\//.test(d.mime || '')) foto(u, 0, d.descricao || d.nome_arquivo); else window.open(u, '_blank');
    }).catch(function(e) { C.toast('Não foi possível abrir: ' + (e.message || e)); });
  }
  function excluir(d) {
    if (!confirm('Excluir o documento “' + (d.descricao || d.nome_arquivo) + '” da pasta?')) return;
    C.chk(C.sb.from('man_equip_docs').delete().eq('id', d.id).select('id')).then(function(r) {
      if (!r.data || !r.data.length) throw new Error('Sem permissão para excluir.');
      C.sb.storage.from(BUCKET).remove([d.caminho]).then(function() {}, function() {});
      return carregarDocs();
    }).then(pinta).catch(function(e) { C.toast('Erro: ' + (e.message || e)); });
  }
  function abrirPor(campo, valor) {
    abrirRoot(); FORM = false;
    ROOT.innerHTML = '<div class="pk-top"><b>📁 Pasta do equipamento</b><button type="button" id="pd-x">Fechar</button></div><div class="pk-main"><div class="pk-c"><div class="sub">Carregando…</div></div></div>'; $('pd-x').onclick = fechar;
    C.chk(C.sb.from('man_equip').select('*').eq(campo, valor).maybeSingle()).then(function(r) {
      if (!r.data) throw new Error(campo === 'loc_item_id' ? 'Esta máquina ainda não tem cadastro na Manutenção.' : 'Equipamento não encontrado.');
      EQ = r.data; return carregarDocs();
    }).then(pinta).catch(function(e) { C.toast(e.message || String(e)); fechar(); });
  }
  return {
    init: function(c) { for (var k in c) C[k] = c[k]; },
    foto: foto,
    abrir: function(id) { abrirPor('id', id); },
    abrirFrota: function(locId) { abrirPor('loc_item_id', locId); },
    // { equip_id: { n: total, venc: vencidos, prox: vencendo em 30 dias } }
    contagens: function() {
      return C.chk(C.sb.from('man_equip_docs').select('equip_id,categoria,validade,data_doc,created_at').order('data_doc', { ascending: false, nullsFirst: false }).order('created_at', { ascending: false })).then(function(r) {
        var m = {}, visto = {}; (r.data || []).forEach(function(d) { var ch = d.equip_id + '|' + d.categoria, ult = !visto[ch]; visto[ch] = 1; var x = m[d.equip_id] = m[d.equip_id] || { n: 0, venc: 0, prox: 0 }; x.n++; if (!ult) return; var n = diasAte(d.validade); if (n !== null) { if (n < 0) x.venc++; else if (n <= 30) x.prox++; } }); return m;
      }).catch(function() { return {}; });
    }
  };
})();
